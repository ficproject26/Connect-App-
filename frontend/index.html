<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const isIgnorableNoise = (msg) => {
          if (!msg) return false;
          let str = '';
          if (typeof msg === 'string') {
            str = msg;
          } else if (msg instanceof Error) {
            str = `${msg.name} ${msg.message} ${msg.stack}`;
          } else if (typeof msg === 'object') {
            try {
              str = `${msg.message || ''} ${msg.stack || ''} ${msg.name || ''} ${JSON.stringify(msg) || ''}`;
            } catch (e) {
              str = String(msg);
            }
          } else {
            str = String(msg);
          }
          return (
            str.includes('A listener indicated an asynchronous response') ||
            str.includes('message channel closed') ||
            str.includes('runtime.lastError') ||
            str.includes('feature_collector') ||
            str.includes('using deprecated parameters') ||
            str.includes('preloaded using link preload') ||
            str.includes('preload but not used') ||
            str.includes('ERR_NETWORK_IO_SUSPENDED') ||
            str.includes('NETWORK_IO_SUSPENDED')
          );
        };

        const filterMethod = (origFn) => {
          return function (...args) {
            const stack = (new Error().stack || '') + '';
            if (stack.includes('feature_collector') || stack.includes('runtime.lastError')) return;
            if (args.some(isIgnorableNoise) || isIgnorableNoise(args.map(a => String(a || '')).join(' '))) return;
            origFn.apply(console, args);
          };
        };

        console.error = filterMethod(console.error);
        console.warn = filterMethod(console.warn);
        console.info = filterMethod(console.info);
        console.log = filterMethod(console.log);

        window.addEventListener('unhandledrejection', function (e) {
          if (isIgnorableNoise(e?.reason) || isIgnorableNoise(e?.reason?.message) || isIgnorableNoise(e?.reason?.stack)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          if (isIgnorableNoise(e?.error) || isIgnorableNoise(e?.message) || isIgnorableNoise(e?.error?.stack)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Access Food, Travel, Stay, Services, Products, and Daily Needs through one powerful membership ecosystem." />
    <title>Connect - One Membership. Unlimited Benefits.</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
