<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const isIgnorableNoise = (msg) => {
          if (!msg) return false;
          let str = '';
          if (typeof msg === 'string') {
            str = msg;
          } else if (msg instanceof Error) {
            str = `${msg.name} ${msg.message} ${msg.stack}`;
          } else {
            try {
              str = JSON.stringify(msg) || String(msg);
            } catch (e) {
              str = String(msg);
            }
          }
          return (
            str.includes('A listener indicated an asynchronous response') ||
            str.includes('message channel closed') ||
            str.includes('runtime.lastError') ||
            str.includes('feature_collector') ||
            str.includes('using deprecated parameters for the initialization function') ||
            str.includes('preloaded using link preload but not used') ||
            str.includes('ERR_NETWORK_IO_SUSPENDED') ||
            str.includes('NETWORK_IO_SUSPENDED')
          );
        };

        const origConsoleError = console.error;
        console.error = function (...args) {
          if (args.some(isIgnorableNoise) || isIgnorableNoise(args.map(a => String(a || '')).join(' '))) return;
          origConsoleError.apply(console, args);
        };

        const origConsoleWarn = console.warn;
        console.warn = function (...args) {
          if (args.some(isIgnorableNoise) || isIgnorableNoise(args.map(a => String(a || '')).join(' '))) return;
          origConsoleWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function (e) {
          if (isIgnorableNoise(e.reason)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          if (isIgnorableNoise(e.error || e.message)) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Access Food, Travel, Stay, Services, Products, and Daily Needs through one powerful membership ecosystem." />
    <title>Connect - One Membership. Unlimited Benefits.</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
