<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const extractText = (item) => {
          if (!item) return '';
          if (typeof item === 'string') return item;
          let text = '';
          try {
            text += ' ' + String(item);
          } catch (e) {}
          if (typeof item === 'object') {
            try {
              if (item.message) text += ' ' + String(item.message);
              if (item.name) text += ' ' + String(item.name);
              if (item.stack) text += ' ' + String(item.stack);
              if (item.reason) text += ' ' + extractText(item.reason);
              if (item.error) text += ' ' + extractText(item.error);
              if (item.filename) text += ' ' + String(item.filename);
              if (item.sourceFile) text += ' ' + String(item.sourceFile);
              if (item.blockedURI) text += ' ' + String(item.blockedURI);
              if (item.violatedDirective) text += ' ' + String(item.violatedDirective);
              if (item.originalPolicy) text += ' ' + String(item.originalPolicy);
              if (item.directive) text += ' ' + String(item.directive);
              if (item.sample) text += ' ' + String(item.sample);
            } catch (e) {}
          }
          return text;
        };

        const isIgnorableNoise = (item) => {
          if (!item) return false;
          const str = extractText(item).toLowerCase();
          return (
            str.includes('a listener indicated an asynchronous response') ||
            str.includes('message channel closed') ||
            str.includes('runtime.lasterror') ||
            str.includes('unsafe-eval') ||
            str.includes('evaluating a string as javascript') ||
            str.includes('violates the following content security policy directive') ||
            str.includes('chrome-extension://') ||
            str.includes('chrome-extension:') ||
            str.includes('content.js') ||
            str.includes('wasm-unsafe-eval') ||
            str.includes('inline-speculation-rules') ||
            str.includes('the action has been blocked') ||
            str.includes('feature_collector') ||
            str.includes('deprecated parameters') ||
            str.includes('initialization function') ||
            str.includes('pass a single object instead') ||
            str.includes('wasm-bindgen') ||
            str.includes('preloaded using link preload') ||
            str.includes('preload but not used') ||
            str.includes('err_network_io_suspended') ||
            str.includes('network_io_suspended') ||
            str.includes('err_connection_refused') ||
            str.includes('websocket connection to') ||
            str.includes('websocket is closed before the connection is established') ||
            str.includes('closed before the connection is established') ||
            str.includes('err_name_not_resolved')
          );
        };

        const filterMethod = (origFn) => {
          return function (...args) {
            try {
              const stack = ((new Error().stack || '') + '').toLowerCase();
              if (
                stack.includes('feature_collector') ||
                stack.includes('runtime.lasterror') ||
                stack.includes('chrome-extension://') ||
                stack.includes('content.js')
              ) {
                return;
              }
              const combined = args.map(extractText).join(' ');
              if (isIgnorableNoise(combined) || args.some(a => isIgnorableNoise(a))) return;
            } catch (e) {}
            origFn.apply(console, args);
          };
        };

        console.error = filterMethod(console.error);
        console.warn = filterMethod(console.warn);
        console.info = filterMethod(console.info);
        console.log = filterMethod(console.log);
        console.debug = filterMethod(console.debug);

        // Global onerror handler to suppress console noise at native level
        const origOnError = window.onerror;
        window.onerror = function (message, source, lineno, colno, error) {
          const text = `${message || ''} ${source || ''} ${extractText(error)}`;
          if (
            isIgnorableNoise(text) ||
            (source && (source.includes('chrome-extension://') || source.includes('content.js')))
          ) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        // Global unhandled rejection handler
        const origOnUnhandledRejection = window.onunhandledrejection;
        window.onunhandledrejection = function (e) {
          const text = extractText(e) + ' ' + extractText(e?.reason);
          if (isIgnorableNoise(text)) {
            if (e && typeof e.preventDefault === 'function') e.preventDefault();
            return true;
          }
          if (typeof origOnUnhandledRejection === 'function') {
            return origOnUnhandledRejection.apply(this, arguments);
          }
        };

        window.addEventListener('unhandledrejection', function (e) {
          const text = extractText(e) + ' ' + extractText(e?.reason);
          if (isIgnorableNoise(text)) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function (e) {
          const text = extractText(e) + ' ' + (e?.message || '') + ' ' + (e?.filename || '');
          if (
            isIgnorableNoise(text) ||
            (e?.filename && (e.filename.includes('chrome-extension://') || e.filename.includes('content.js')))
          ) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);

        // Intercept Content Security Policy violation events dispatched by browser extensions
        const handleCSPViolation = function (e) {
          const text = `${e.blockedURI || ''} ${e.violatedDirective || ''} ${e.originalPolicy || ''} ${e.sample || ''} ${e.sourceFile || ''} ${e.documentURI || ''}`;
          if (
            isIgnorableNoise(text) ||
            (e.blockedURI && e.blockedURI.includes('chrome-extension')) ||
            (e.sourceFile && (e.sourceFile.includes('chrome-extension') || e.sourceFile.includes('content.js'))) ||
            (e.originalPolicy && e.originalPolicy.includes('chrome-extension'))
          ) {
            if (typeof e.preventDefault === 'function') e.preventDefault();
            if (typeof e.stopPropagation === 'function') e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          }
        };
        window.addEventListener('securitypolicyviolation', handleCSPViolation, true);
        if (typeof document !== 'undefined') {
          document.addEventListener('securitypolicyviolation', handleCSPViolation, true);
        }

        // Proactively clear Chromium unchecked runtime.lastError flag if extension runtime exists in tab
        try {
          const markLastErrorChecked = () => {
            try {
              if (typeof window !== 'undefined' && window.chrome && window.chrome.runtime) {
                const _ = window.chrome.runtime.lastError;
              }
            } catch (e) {}
          };
          markLastErrorChecked();
          setInterval(markLastErrorChecked, 10000);
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Access Food, Travel, Stay, Services, Products, and Daily Needs through one powerful membership ecosystem." />
    <title>Connect - One Membership. Unlimited Benefits.</title>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
